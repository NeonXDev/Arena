name: luma_sleep
description: A privacy-first Android sleep and sound tracker built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_overlay_window: ^0.5.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  record: ^7.1.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
